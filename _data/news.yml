- date: May, 2026
  headline: Our paper led by Junna on climate-driven species range shifts was published in <b><a href="https://www.science.org/doi/abs/10.1126/science.aea1676">Science</a></b>! The work was featured by <a href="https://apnews.com/article/plants-extinction-climate-change-unusual-habitat-risk-b059130319e66938073c681a705d6391">Associated Press</a>, <a href="https://www.reuters.com/business/environment/climate-change-threatens-global-plant-species-habitats-shrink-2026-05-23/">Reuters</a>, and > 500 media outlets worldwide, including BBC, France 24, CBS, and POLITICO.

- date: Sep, 2025
  headline: Congratulations to Malavika on receiving the Dean's Circle Fellowship!
  
- date: Dec, 2024
  headline: Congrats to Dr. Dan! He graduated with a Ph.D. in Hydrological Sciences and is heading to join Dr. Bettina Weber's lab as a postdoc.
  
- date: Jun, 2024
  headline: Our paper on coupled-evolution of landscapes and plants has been published in <a href="https://www.cell.com/trends/ecology-evolution/abstract/S0169-5347(24)00119-8">Trends in Ecology & Evolution</a>!
  
- date: Feb, 2024
  headline: Xiaoli and [Dawn Sumner](https://dysumner.faculty.ucdavis.edu) received the <b>NSF grant</b> to study the effects of environmental change on microbial self-organized patterns in Antarctic Lakes. 

- date: Feb, 2024
  headline: Dan's first dissertation chapter on spatial self-organization at the community level is published in [Ecosystems](https://link.springer.com/article/10.1007/s10021-023-00898-2)!

- date: Jan, 2024
  headline: <b>Xiaoli is promoted to associate professor with tenure!</b>

- date: Dec, 2023
  headline: Our new paper on climate impacts on global values of natural capital was published in <strong><a href="https://www.nature.com/articles/s41586-023-06769-z">Nature</a></strong>.

- date: Jul, 2023
  headline: Xiaoli received the <b>NSF grant</b> to study the spatial self-organization of vegetation and biological soil crust community in drylands!

- date: Mar, 2022
  headline: Junna graduated from Graduate Group in Ecology and is moving to Yale as a postdoc! 

